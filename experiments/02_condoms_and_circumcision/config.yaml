# Exp 02: exp 01 ranges plus condom_scale, with condom use and circumcision inputs (see README.md)
n_samples: 200
n_seeds_central: 10
n_agents: 10000
stop: 2022 # After the last target (2021.5)
seed: 1 # For the Latin hypercube
pars: # name: [low, high, scale]; hiv_ and nw_ go to sti.HIV and sti.StructuredSexual
  hiv_beta_m2f: [0.002, 0.05, log]
  hiv_rel_init_prev: [0.25, 4, log]
  nw_prop_f0: [0.6, 0.95, linear]
  nw_prop_m0: [0.5, 0.9, linear]
  nw_f1_conc: [0.0, 0.2, linear]
  nw_m1_conc: [0.05, 0.4, linear]
  nw_fsw_shares: [0.01, 0.08, linear]
  nw_client_shares: [0.05, 0.25, linear]
  test_scale: [0.25, 4, log]
  condom_scale: [0.5, 1.5, linear]
