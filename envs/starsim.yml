# Optima′ (models/optima/v4) and HIVsim, on Starsim v4
#   conda env create -f envs/starsim.yml
name: starsim
channels: [conda-forge]
dependencies:
  - python=3.12 # Starsim 4 needs >=3.12
  - pip
  - pytest
  - pytest-xdist # Tests run in parallel by default (pytest.ini)
  - pip:
    - starsim==4.0.0rc3 # From PyPI, with its kernels already built
    # Also needs Starsim PR #1573 (branch v4-rs-nov09, f1273734) on rc3 until it is released: a checkout on PYTHONPATH ahead of this
    - stisim @ git+https://github.com/starsimhub/stisim@ebbc8e78344251a43e9dcee059a6eedacad90787 # rs-v4-art-mortality (STIsim PR #613, on #612: ART as its own declared module, condom and bare-network fixes; mortality options off by default)
variables:
  PYTHONNOUSERSITE: 1 # Ignore packages in ~/.local, which can shadow these
