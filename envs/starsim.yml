# Optima′ (models/optima/v4) and HIVsim, on Starsim v4
#   conda env create -f envs/starsim.yml
name: starsim
channels: [conda-forge]
dependencies:
  - python=3.12 # Starsim 4 needs >=3.12
  - pip
  - pytest
  - pytest-xdist # Tests run in parallel by default (pytest.ini)
  - pip:
    - starsim==4.0.0rc4 # From PyPI, with its kernels already built
    # Also needs Starsim PR #1614 (branch rs-nov16, 6c92fa7b: v4 at dfd4c003, with speed fixes for the declared ODE and loud errors for the old method names) until it is released: a checkout on PYTHONPATH ahead of this
    - stisim @ git+https://github.com/starsimhub/stisim@085c3f6cb642de653d0f748675bacad9c8e6ebe7 # rs-v4-art-mortality (STIsim PR #613, on #612: ART as its own declared module, condom and bare-network fixes; mortality options off by default), ported to Starsim v4 as of #1614
variables:
  PYTHONNOUSERSITE: 1 # Ignore packages in ~/.local, which can shadow these
